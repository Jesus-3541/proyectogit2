name: Comprobar Tokens
on: [push]

jobs:
  check-secrets:
    runs-on: self-hosted
    steps:
      - name: Comparar DEV_TOKEN
        shell: powershell
        run: |
          if ("${{ secrets.DEV_TOKEN }}" -eq "$env:LOCAL_DEV_TOKEN") {
            Write-Host "Coinciden"
          } else {
            Write-Host "No coinciden"
            exit 1
          }
