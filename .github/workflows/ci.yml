name: CI Workflow
on:
  push:
    branches: [ "develop" ]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ "develop" ]
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Update README con feature
        run: |
          echo "Añadida feature: ${{ github.head_ref || github.ref_name }}" >> README.md
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add README.md
          git commit -m "Actualiza README con rama feature" || echo "Sin cambios"
          git push

  validate-dev:
    needs: update-readme
    runs-on: self-hosted
    steps:
      - name: Comparar DEV_TOKEN
        shell: powershell
        run: |
          if ("${{ secrets.DEV_TOKEN }}" -eq "$env:LOCAL_DEV_TOKEN") {
            Write-Host "Coinciden"
          } else {
            Write-Host "No coinciden"
            exit 1
          }